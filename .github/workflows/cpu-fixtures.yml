name: CPU fixtures and upstream integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: environments/modern.txt
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 scikit-image==0.24.0 opencv-python-headless==4.10.0.84 imageio==2.36.0 pillow==11.3.0 pytest==8.3.4 tqdm
      - run: python scripts/check_upstream_integrity.py
      - run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q
